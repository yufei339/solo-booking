{% extends "base.html" %}

{% block title %}预约成功{% endblock %}

{% block content %}
  <h1>预约成功</h1>
  <div class="card">
    <p><strong>{{ day }} {{ time }}</strong> · {{ booking.name }}</p>
    <p class="muted">请保存本页链接，取消预约要用。上课前 24 小时内不能取消。</p>
    <p><a href="/booking/{{ day }}/{{ time }}/{{ booking.token }}/cancel">取消这次预约</a></p>
  </div>
  <p><a href="/">← 返回首页</a></p>
{% endblock %}
