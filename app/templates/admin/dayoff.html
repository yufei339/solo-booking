{% extends "base.html" %}

{% block title %}请假日{% endblock %}

{% block content %}
  {% include "admin/_nav.html" %}
  <h1>请假日</h1>
  <form method="post" action="/admin/dayoff" class="card">
    <label>日期
      <input type="date" name="day" min="{{ today }}" required>
    </label>
    <button type="submit">添加</button>
  </form>
  <div class="card">
    {% if not days %}<p>暂无请假日</p>{% endif %}
    {% for d in days %}
      <form method="post" action="/admin/dayoff/{{ d }}/delete" class="row">
        <span>{{ d }}</span>
        <button class="link">删除</button>
      </form>
    {% endfor %}
  </div>
{% endblock %}
