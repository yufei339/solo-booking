{% extends "base.html" %}

{% block title %}每周可约时段{% endblock %}

{% block content %}
  <nav><a href="/admin/dayoff">请假日</a> · <form method="post" action="/admin/logout" class="inline"><button class="link">退出</button></form></nav>
  <h1>每周可约时段</h1>
  {% if saved %}<p class="ok">已保存</p>{% endif %}
  <form method="post" action="/admin/template">
    {% for name in weekdays %}
      {% set d = loop.index0|string %}
      <div class="card">
        <strong>{{ name }}</strong>
        <div class="chips">
          {% for h in hours %}
            <label class="chip">
              <input type="checkbox" name="slot" value="{{ d }}-{{ h }}" {% if h in slots[d] %}checked{% endif %}>
              <span>{{ h }}</span>
            </label>
          {% endfor %}
        </div>
      </div>
    {% endfor %}
    <button type="submit">保存</button>
  </form>
{% endblock %}
