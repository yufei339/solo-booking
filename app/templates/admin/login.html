{% extends "base.html" %}

{% block title %}教练登录{% endblock %}

{% block content %}
  <h1>教练登录</h1>
  <form method="post" action="/admin/login" class="card">
    <label>密码
      <input type="password" name="password" required autofocus>
    </label>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <button type="submit">登录</button>
  </form>
{% endblock %}
