<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f50">
  <title>{% block title %}约课{% endblock %}</title>
  <style>
    :root {
      --bg: #f4f1ec; --card: #ffffff; --ink: #1c1c1c; --muted: #6b7280; --line: #e6e2db;
      --accent: #1f6f50; --accent-soft: #e3f0e9; --accent-ink: #ffffff; --danger: #b4232c; --ok: #1a7f4b;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
           font: 16px/1.5 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
           -webkit-font-smoothing: antialiased; }
    a { color: var(--accent); }
    main { max-width: 480px; margin: 0 auto; padding: 16px 16px 96px; }
    h1 { font-size: 22px; margin: 8px 0 4px; }
    h2 { font-size: 15px; color: var(--muted); font-weight: 500; margin: 20px 0 8px; }
    p { margin: 6px 0; }
    .muted { color: var(--muted); }
    .ok { color: var(--ok); }
    .error { color: var(--danger); }

    /* 品牌区 */
    .brand { display: flex; align-items: center; gap: 12px; padding: 8px 0 16px; }
    .brand .avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--accent);
                     color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 18px; }
    .brand .name { font-size: 18px; font-weight: 700; }
    .brand .tagline { font-size: 13px; color: var(--muted); }

    /* 卡片 */
    .card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-top: 12px;
            box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .summary { display: grid; gap: 4px; }
    .summary .big { font-size: 18px; font-weight: 700; }

    /* 日期条 */
    .days { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 8px; margin: 0 -16px; padding-left: 16px;
            scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .days::-webkit-scrollbar { display: none; }
    .day { flex: 0 0 56px; height: 68px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
           display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
           font: inherit; color: var(--ink); cursor: pointer; padding: 0; }
    .day small { font-size: 12px; color: var(--muted); }
    .day b { font-size: 18px; }
    .day .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
    .day.is-empty { color: var(--muted); background: transparent; }
    .day.is-empty b { color: #b8b3aa; }
    .day.is-selected { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .day.is-selected small, .day.is-selected b { color: var(--accent-ink); }
    .day.is-selected .dot { background: var(--accent-ink); }

    /* 时段卡 */
    .panel[hidden] { display: none; }
    .slot { display: flex; align-items: center; justify-content: space-between; gap: 12px;
            background: var(--card); border-radius: var(--radius); padding: 14px 16px; margin-top: 10px; }
    .slot .time { font-size: 17px; font-weight: 700; }
    .slot .meta { font-size: 13px; color: var(--muted); }
    .empty { text-align: center; color: var(--muted); padding: 32px 0; }

    /* 表单 */
    label { display: block; margin-bottom: 12px; font-size: 14px; color: var(--muted); }
    input { width: 100%; font-size: 16px; padding: 12px; margin-top: 6px; border: 1px solid var(--line);
            border-radius: 10px; background: #fff; color: var(--ink); }
    input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

    /* 按钮 */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: inherit; font-weight: 600;
           padding: 12px 18px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink);
           text-decoration: none; cursor: pointer; }
    .btn.block { width: 100%; }
    .btn.secondary { background: var(--accent-soft); color: var(--accent); }
    .btn.danger { background: #fbe9ea; color: var(--danger); }
    .btn.sm { padding: 10px 16px; font-size: 15px; }
    .link { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; cursor: pointer; }
    .sticky { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
              background: linear-gradient(to top, var(--bg) 70%, transparent); }
    .sticky .btn { max-width: 448px; margin: 0 auto; display: flex; }
    .back { display: inline-block; margin-bottom: 8px; font-size: 14px; text-decoration: none; }

    /* 后台 */
    nav { font-size: 14px; margin-bottom: 8px; } nav .inline { display: inline; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .chip input { display: none; }
    .chip span { display: inline-block; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 14px; }
    .chip input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: 0; }
    button[type=submit]:not(.link):not(.btn) { width: 100%; font: inherit; font-weight: 600; padding: 12px; margin-top: 8px;
            border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink); }
  </style>
</head>
<body>
  <main>{% block content %}{% endblock %}</main>
  {% block after %}{% endblock %}
</body>
</html>
