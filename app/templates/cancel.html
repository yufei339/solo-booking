{% extends "base.html" %}

{% block title %}取消预约{% endblock %}

{% block content %}
  <a class="back" href="/booking/{{ day }}/{{ time }}/{{ token }}">← 返回预约详情</a>
  <h1>取消预约</h1>
  <div class="card summary">
    <div class="big">{{ day|cn_date }} · {{ time }} – {{ time|end_time }}</div>
  </div>
  {% if allowed %}
    <form method="post" id="cancel-form"></form>
    <div class="sticky"><button class="btn danger block" type="submit" form="cancel-form">确认取消</button></div>
  {% else %}
    <div class="card"><p class="error" style="margin:0">距上课不足 24 小时，不能自助取消，请直接联系教练。</p></div>
  {% endif %}
{% endblock %}
