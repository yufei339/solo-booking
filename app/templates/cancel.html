{% extends "base.html" %}

{% block title %}取消预约{% endblock %}

{% block content %}
  <h1>取消预约</h1>
  <div class="card">
    <p><strong>{{ day }} {{ time }}</strong></p>
    {% if allowed %}
      <form method="post">
        <button type="submit">确认取消</button>
      </form>
    {% else %}
      <p class="error">距上课不足 24 小时，不能自助取消，请直接联系教练。</p>
    {% endif %}
  </div>
  <p><a href="/booking/{{ day }}/{{ time }}/{{ token }}">← 返回预约详情</a></p>
{% endblock %}
