{% extends "base.html" %}

{% block title %}预约 {{ day }} {{ time }}{% endblock %}

{% block content %}
  <p><a href="/">← 返回</a></p>
  <h1>{{ day }} {{ time }}</h1>
  <form method="post" class="card">
    <label>姓名
      <input type="text" name="name" value="{{ name }}" required autofocus>
    </label>
    <label>手机号
      <input type="tel" name="phone" value="{{ phone }}" required>
    </label>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <button type="submit">确认预约</button>
  </form>
{% endblock %}
